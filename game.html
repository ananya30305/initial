<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Our Little Home ♡</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="game.css">
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="top-bar">

        <a href="index.html" class="back-button">
            ← <span>Back</span>
        </a>

        <div class="home-title">
            <span>Our Little Home</span>
            <small>just you & me ♡</small>
        </div>

        <div class="room-name" id="roomName">
            Hall
        </div>

    </header>


    <!-- =========================
         GAME WORLD
    ========================== -->

    <main class="game-world" id="gameWorld">

        <!-- Room -->
        <div
            class="room-background"
            id="roomBackground">
        </div>

        <!-- Soft overlay -->
        <div class="world-light"></div>


        <!-- Top love message -->
        <div class="love-message" id="loveMessage">
            Welcome home, love ♡
        </div>


        <!-- =========================
             BOY
        ========================== -->

        <div
            class="character boy-character"
            id="boyCharacter">

            <img
                id="boyImage"
                class="character-img"
                src="game-assets/characters/boy/boy-front.png"
                alt="Boy">

        </div>


        <!-- =========================
             GIRL
        ========================== -->

        <div
            class="character girl-character"
            id="girlCharacter">

            <div
                class="speech-bubble"
                id="girlSpeech">
                I'm coming with you 🥰
            </div>

            <img
                id="girlImage"
                class="character-img"
                src="game-assets/characters/girl/girl-front.png"
                alt="Girl">

        </div>


        <!-- Action message -->
        <div
            class="action-message hidden"
            id="actionMessage">
        </div>

    </main>


    <!-- =========================
         CONTROLS
    ========================== -->

    <section class="controls">

        <div class="controls-inner">


            <!-- ROOMS -->

            <div class="places-section">

                <div class="section-title">
                    Go somewhere ♡
                </div>

                <div class="room-buttons" id="roomButtons">

                    <button
                        class="room-button active"
                        data-room="0">
                        🛋️ Hall
                    </button>

                    <button
                        class="room-button"
                        data-room="1">
                        🍳 Kitchen
                    </button>

                    <button
                        class="room-button"
                        data-room="2">
                        🛏️ Bedroom
                    </button>

                    <button
                        class="room-button"
                        data-room="3">
                        🚿 Bathroom
                    </button>

                    <button
                        class="room-button"
                        data-room="4">
                        🪔 Pooja
                    </button>

                </div>

            </div>


            <!-- CUTE ACTION -->

            <div class="action-section">

                <button
                    class="cute-action"
                    id="cuteAction">
                    ✨ Do something cute
                </button>

            </div>


            <!-- MOVEMENT -->

            <div class="movement">

                <button
                    class="move-button"
                    id="moveLeft"
                    aria-label="Move left">
                    ←
                </button>

                <span class="movement-label">
                    Move
                </span>

                <button
                    class="move-button"
                    id="moveRight"
                    aria-label="Move right">
                    →
                </button>

            </div>

        </div>

    </section>


    <script src="game.js"></script>

</body>

</html>
