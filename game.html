<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Little Home ♡</title>


    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >


    <!-- Game CSS -->

    <link
        rel="stylesheet"
        href="game.css"
    >

</head>


<body>


    <!-- =================================================
         TOP BAR
    ================================================== -->

    <header class="top-bar">


        <!-- Back -->

        <a
            href="index.html"
            class="back-button"
        >
            ← Back
        </a>


        <!-- Title -->

        <div class="home-title">

            <span>
                Our Little Home
            </span>

            <small>
                just you & me ♡
            </small>

        </div>


        <!-- Current Room -->

        <div
            class="room-name"
            id="roomName"
        >
            Hall
        </div>

    </header>



    <!-- =================================================
         GAME WORLD
    ================================================== -->

    <main
        class="game-world"
        id="gameWorld"
    >


        <!-- Room Background -->

        <div
            class="room-background"
            id="roomBackground"
            style="background-image: url('game-assets/rooms/hall.png');"
        >
        </div>


        <!-- Soft Lighting -->

        <div class="world-light"></div>



        <!-- =================================================
             LOVE MESSAGE
        ================================================== -->

        <div
            class="love-message"
            id="loveMessage"
        >
            Welcome home, love ♡
        </div>



        <!-- =================================================
             POOJA INFORMATION
        ================================================== -->

        <div
            class="pooja-info hidden"
            id="poojaInfo"
        >

            <div>
                🪔
            </div>

            <span>
                Let's pray together ♡
            </span>

            <div class="deities">

                <span>🙏</span>

                <span>🪷</span>

                <span>✨</span>

            </div>

        </div>



        <!-- =================================================
             BOY CHARACTER
        ================================================== -->

        <div
            class="character boy-character"
            id="boyCharacter"
        >

            <img
                src="game-assets/characters/boy/boy-front.png"
                alt="Boy character"
            >

        </div>



        <!-- =================================================
             GIRL CHARACTER
        ================================================== -->

        <div
            class="character girl-character"
            id="girlCharacter"
        >


            <!-- Girl Speech -->

            <div
                class="speech-bubble"
                id="girlSpeech"
            >
                I'm coming with you 🥰
            </div>


            <!-- Girl -->

            <img
                src="game-assets/characters/girl/girl-front.png"
                alt="Girl character"
            >

        </div>



        <!-- =================================================
             ACTION MESSAGE
        ================================================== -->

        <div
            class="action-message hidden"
            id="actionMessage"
        >
        </div>


    </main>



    <!-- =================================================
         BOTTOM CONTROLS
    ================================================== -->

    <section class="controls">


        <div class="controls-inner">


            <!-- =================================================
                 ROOM MENU
            ================================================== -->

            <div class="places-section">


                <div class="section-title">
                    Go somewhere ♡
                </div>


                <div class="room-buttons">


                    <!-- HALL -->

                    <button
                        type="button"
                        class="room-button active"
                        onclick="switchRoom(0)"
                    >
                        🛋️ Hall
                    </button>


                    <!-- KITCHEN -->

                    <button
                        type="button"
                        class="room-button"
                        onclick="switchRoom(1)"
                    >
                        🍳 Kitchen
                    </button>


                    <!-- BEDROOM -->

                    <button
                        type="button"
                        class="room-button"
                        onclick="switchRoom(2)"
                    >
                        🛏️ Bedroom
                    </button>


                    <!-- BATHROOM -->

                    <button
                        type="button"
                        class="room-button"
                        onclick="switchRoom(3)"
                    >
                        🚿 Bathroom
                    </button>


                    <!-- POOJA -->

                    <button
                        type="button"
                        class="room-button"
                        onclick="switchRoom(4)"
                    >
                        🪔 Pooja
                    </button>


                </div>

            </div>



            <!-- =================================================
                 CUTE ACTION BUTTON
            ================================================== -->

            <div class="action-section">


                <button
                    type="button"
                    class="cute-action"
                    onclick="doSomethingCute()"
                >
                    ✨ Do something cute
                </button>


            </div>



            <!-- =================================================
                 MOVEMENT BUTTONS
            ================================================== -->

            <div class="movement">


                <!-- LEFT -->

                <button
                    type="button"
                    class="move-button"
                    onclick="moveCharacter('left')"
                    aria-label="Move left"
                >
                    ←
                </button>


                <span class="movement-label">
                    Move
                </span>


                <!-- RIGHT -->

                <button
                    type="button"
                    class="move-button"
                    onclick="moveCharacter('right')"
                    aria-label="Move right"
                >
                    →
                </button>


            </div>


        </div>

    </section>



    <!-- =================================================
         GAME JAVASCRIPT
    ================================================== -->

    <script src="game.js"></script>


</body>

</html>
