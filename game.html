
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little Home ♡</title>

    <link rel="stylesheet" href="game.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="top-bar">

        <a href="index.html" class="back-button">
            ← <span>Back</span>
        </a>

        <div class="home-title">
            <span>Our Little Home</span>
            <small>just you & me ♡</small>
        </div>

        <div class="room-name" id="roomName">
            Hall
        </div>

    </header>


    <!-- =========================
         GAME WORLD
    ========================== -->

    <main class="game-world" id="gameWorld">

        <!-- Room background -->
        <div
            class="room-background"
            id="roomBackground">
        </div>

        <!-- Soft overlay -->
        <div class="world-light"></div>


        <!-- Top love message -->
        <div class="love-message" id="loveMessage">
            Welcome home, love ♡
        </div>


        <!-- Pooja information -->
        <div class="pooja-info hidden" id="poojaInfo">

            <div>🪔</div>

            <span>Let's pray together ♡</span>

            <div class="deities">
                <span>Vishnu</span>
                <span>Shiva</span>
                <span>Ganapathi</span>
                <span>Lakshmi</span>
            </div>

        </div>


        <!-- =========================
             BOY
        ========================== -->

        <div
            class="character boy-character"
            id="boyCharacter">

            <img
                id="boySprite"
                src="game-assets/characters/boy/boy-front.png"
                alt="Boy character">

        </div>


        <!-- =========================
             GIRL
        ========================== -->

        <div
            class="character girl-character"
            id="girlCharacter">

            <div
                class="speech-bubble"
                id="girlSpeech">
                I'm coming with you 🥰
            </div>

            <img
                id="girlSprite"
                src="game-assets/characters/girl/girl-front.png"
                alt="Girl character">

        </div>


        <!-- Cute action message -->
        <div
            class="action-message hidden"
            id="actionMessage">
        </div>

    </main>


    <!-- =========================
         CONTROLS
    ========================== -->

    <section class="controls">

        <div class="controls-inner">


            <!-- ROOMS -->

            <div class="places-section">

                <div class="section-title">
                    Go somewhere ♡
                </div>

                <div class="room-buttons" id="roomButtons">

                    <button
                        class="room-button active"
                        data-room="hall">
                        🛋️ Hall
                    </button>

                    <button
                        class="room-button"
                        data-room="kitchen">
                        🍳 Kitchen
                    </button>

                    <button
                        class="room-button"
                        data-room="bedroom">
                        🛏️ Bedroom
                    </button>

                    <button
                        class="room-button"
                        data-room="bathroom">
                        🚿 Bathroom
                    </button>

                    <button
                        class="room-button"
                        data-room="pooja">
                        🪔 Pooja
                    </button>

                </div>

            </div>


            <!-- BOTTOM ACTIONS -->

            <div class="bottom-controls">


                <!-- Cute action -->

                <button
                    class="cute-action"
                    id="cuteAction">
                    ✨ Do something cute
                </button>


                <!-- Movement -->

                <div class="movement">

                    <button
                        class="move-button"
                        id="moveLeft"
                        aria-label="Move left">
                        ←
                    </button>

                    <span class="movement-label">
                        Move
                    </span>

                    <button
                        class="move-button"
                        id="moveRight"
                        aria-label="Move right">
                        →
                    </button>

                </div>

            </div>

        </div>

    </section>


    <script src="game.js"></script>

</body>
</html>
