<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little Home ❤️</title>

    <link rel="stylesheet" href="game.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TOP BAR -->
    <header class="top-bar">

        <a href="index.html" class="back-button">
            ← Back
        </a>

        <div class="home-title">
            <span>Our Little Home</span>
            <small>just you & me ♡</small>
        </div>

        <div class="room-name" id="roomName">
            Hall
        </div>

    </header>


    <!-- GAME WORLD -->
    <main class="game-world">

        <!-- ROOM -->
        <div
            class="room-background"
            id="roomBackground">
        </div>


        <!-- SOFT LIGHT OVERLAY -->
        <div class="world-light"></div>


        <!-- LITTLE LOVE MESSAGE -->
        <div class="love-message" id="loveMessage">
            Welcome home, love ♡
        </div>


        <!-- POOJA ROOM INFORMATION -->
        <div class="pooja-info hidden" id="poojaInfo">

            <div>🪔</div>

            <span>Our little prayer corner</span>

            <div class="deities">
                <span>Vishnu</span>
                <span>Shiva</span>
                <span>Ganesha</span>
                <span>Lakshmi</span>
            </div>

        </div>


        <!-- GIRL -->
        <div
            class="character girl-character"
            id="girlCharacter">

            <div
                class="speech-bubble"
                id="girlSpeech">
                Let me come with you ❤️
            </div>

            <img
                id="girlSprite"
                src="game-assets/characters/girl/girl-front.png"
                alt="Girl character">

        </div>


        <!-- BOY -->
        <div
            class="character boy-character"
            id="boyCharacter">

            <img
                id="boySprite"
                src="game-assets/characters/boy/boy-front.png"
                alt="Boy character">

        </div>


        <!-- ACTION MESSAGE -->
        <div
            class="action-message hidden"
            id="actionMessage">
        </div>

    </main>


    <!-- BOTTOM CONTROLS -->
    <section class="controls">

        <div class="controls-inner">

            <!-- ROOMS -->
            <div class="places-section">

                <div class="section-title">
                    Go somewhere ♡
                </div>

                <div class="room-buttons">

                    <button
                        onclick="goToRoom('hall')"
                        class="room-button active"
                        id="hallButton">
                        🛋️ Hall
                    </button>

                    <button
                        onclick="goToRoom('kitchen')"
                        class="room-button"
                        id="kitchenButton">
                        🍳 Kitchen
                    </button>

                    <button
                        onclick="goToRoom('bedroom')"
                        class="room-button"
                        id="bedroomButton">
                        🛏️ Bedroom
                    </button>

                    <button
                        onclick="goToRoom('bathroom')"
                        class="room-button"
                        id="bathroomButton">
                        🚿 Bathroom
                    </button>

                    <button
                        onclick="goToRoom('pooja')"
                        class="room-button"
                        id="poojaButton">
                        🪔 Pooja
                    </button>

                </div>

            </div>


            <!-- ACTION -->
            <div class="action-section">

                <button
                    class="cute-action"
                    onclick="doCuteThing()">
                    ✨ Do something cute
                </button>

            </div>


            <!-- MOVEMENT -->
            <div class="movement">

                <button
                    class="move-button"
                    onclick="moveCharacter('left')">
                    ←
                </button>

                <div class="movement-label">
                    Move
                </div>

                <button
                    class="move-button"
                    onclick="moveCharacter('right')">
                    →
                </button>

            </div>

        </div>

    </section>


    <script src="game.js"></script>

</body>
</html>
