<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Our Little Home ♡</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="game.css">
</head>

<body>

    <main class="game-page">

        <!-- =========================
             TOP BAR
        ========================== -->

        <header class="top-bar">

            <a href="index.html" class="back-button">
                ← <span>Back</span>
            </a>

            <div class="home-title">
                <span>Our Little Home</span>
                <small>just you & me ♡</small>
            </div>

            <div class="room-name" id="currentRoomLabel">
                Hall
            </div>

        </header>


        <!-- =========================
             GAME WORLD
        ========================== -->

        <section class="game-world" id="gameWorld">

            <!-- Room image -->
            <div
                class="room-background"
                id="roomBackground">
            </div>

            <!-- Soft overlay -->
            <div class="world-light"></div>


            <!-- Top love message -->
            <div class="love-message" id="loveMessage">
                Welcome home, love ♡
            </div>


            <!-- =========================
                 POOJA INFORMATION
            ========================== -->

            <div
                class="pooja-info hidden"
                id="poojaInfo">

                <div>🪔</div>

                <span>
                    Let's pray together ♡
                </span>

                <div class="deities">
                    <span>🕉️</span>
                    <span>🙏</span>
                    <span>🌸</span>
                    <span>✨</span>
                </div>

            </div>


            <!-- =========================
                 GIRL
            ========================== -->

            <div
                class="character girl-character"
                id="girlCharacter">

                <div
                    class="speech-bubble"
                    id="girlSpeech">
                    I'm coming with you 🥰
                </div>

                <img
                    src="game-assets/characters/girl/girl-front.png"
                    alt="Girl character"
                    draggable="false">

            </div>


            <!-- =========================
                 BOY
            ========================== -->

            <div
                class="character boy-character"
                id="boyCharacter">

                <div
                    class="speech-bubble hidden"
                    id="boySpeech">
                    Wait for me! ❤️
                </div>

                <img
                    src="game-assets/characters/boy/boy-front.png"
                    alt="Boy character"
                    draggable="false">

            </div>


            <!-- Temporary action message -->
            <div
                class="action-message hidden"
                id="actionMessage">
            </div>

        </section>


        <!-- =========================
             BOTTOM CONTROLS
        ========================== -->

        <section class="controls">

            <div class="controls-inner">


                <!-- =========================
                     ROOMS
                ========================== -->

                <div class="places-section">

                    <div class="section-title">
                        Go somewhere ♡
                    </div>

                    <div class="room-buttons">

                        <button
                            class="room-button active"
                            data-room="hall"
                            onclick="goToRoom('hall')">
                            🛋️ Hall
                        </button>

                        <button
                            class="room-button"
                            data-room="kitchen"
                            onclick="goToRoom('kitchen')">
                            🍳 Kitchen
                        </button>

                        <button
                            class="room-button"
                            data-room="bedroom"
                            onclick="goToRoom('bedroom')">
                            🛏️ Bedroom
                        </button>

                        <button
                            class="room-button"
                            data-room="bathroom"
                            onclick="goToRoom('bathroom')">
                            🚿 Bathroom
                        </button>

                        <button
                            class="room-button"
                            data-room="pooja"
                            onclick="goToRoom('pooja')">
                            🪔 Pooja
                        </button>

                    </div>

                </div>


                <!-- =========================
                     ACTION
                ========================== -->

                <div class="action-section">

                    <button
                        class="cute-action"
                        id="cuteAction"
                        onclick="doSomethingCute()">

                        ✨ Do something cute

                    </button>

                </div>


                <!-- =========================
                     MOVEMENT
                ========================== -->

                <div class="movement">

                    <button
                        class="move-button"
                        id="leftButton"
                        onclick="moveCharacter('left')"
                        aria-label="Move left">
                        ←
                    </button>

                    <span class="movement-label">
                        Move
                    </span>

                    <button
                        class="move-button"
                        id="rightButton"
                        onclick="moveCharacter('right')"
                        aria-label="Move right">
                        →
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="game.js"></script>

</body>

</html>
