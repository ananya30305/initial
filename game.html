
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Our Little Home ♡</title>

    <link rel="stylesheet" href="game.css">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= TOP BAR ================= -->

    <header class="top-bar">

        <a href="index.html" class="back-button">
            ← <span>Back</span>
        </a>

        <div class="home-title">
            <span>Our Little Home</span>
            <small>just you & me ♡</small>
        </div>

        <div class="room-name" id="roomName">
            Hall
        </div>

    </header>


    <!-- ================= GAME WORLD ================= -->

    <main class="game-world" id="gameWorld">

        <div class="room-background" id="roomBackground"></div>

        <div class="world-light"></div>


        <!-- TOP LOVE MESSAGE -->

        <div class="love-message" id="loveMessage">
            Welcome home, love ♡
        </div>


        <!-- POOJA INFORMATION -->

        <div class="pooja-info hidden" id="poojaInfo">

            <div>🪔</div>

            <span>Let's pray together ♡</span>

            <div class="deities">
                <span>🙏</span>
                <span>🪷</span>
                <span>🕉️</span>
                <span>✨</span>
            </div>

        </div>


        <!-- ================= CHARACTERS ================= -->

        <div class="character boy-character" id="boyCharacter">

            <img
                id="boyImage"
                src="game-assets/characters/boy/boy-front.png"
                alt="Boy">

        </div>


        <div class="character girl-character" id="girlCharacter">

            <div class="speech-bubble" id="girlSpeech">
                I'm coming with you 🥰
            </div>

            <img
                id="girlImage"
                src="game-assets/characters/girl/girl-front.png"
                alt="Girl">

        </div>


        <!-- ACTION MESSAGE -->

        <div class="action-message hidden" id="actionMessage"></div>

    </main>


    <!-- ================= CONTROLS ================= -->

    <section class="controls">

        <div class="controls-inner">


            <!-- ROOMS -->

            <div class="places-section">

                <div class="section-title">
                    Go somewhere ♡
                </div>

                <div class="room-buttons">

                    <button class="room-button active"
                        data-room="hall">
                        🛋️ Hall
                    </button>

                    <button class="room-button"
                        data-room="kitchen">
                        🍳 Kitchen
                    </button>

                    <button class="room-button"
                        data-room="bedroom">
                        🛏️ Bedroom
                    </button>

                    <button class="room-button"
                        data-room="bathroom">
                        🚿 Bathroom
                    </button>

                    <button class="room-button"
                        data-room="pooja">
                        🪔 Pooja
                    </button>

                </div>

            </div>


            <!-- ACTION -->

            <div class="action-section">

                <button class="cute-action" id="cuteAction">
                    ✨ Do something cute
                </button>

            </div>


            <!-- MOVEMENT -->

            <div class="movement">

                <button class="move-button"
                    id="moveLeft"
                    aria-label="Move left">
                    ←
                </button>

                <span class="movement-label">
                    MOVE
                </span>

                <button class="move-button"
                    id="moveRight"
                    aria-label="Move right">
                    →
                </button>

            </div>


        </div>

    </section>


    <script src="game.js"></script>

</body>
</html>
